# ============================================================================
# FoodBridge - Production Nginx Reverse Proxy & Edge Gateway Configuration
# Security Hardening:
# 1. Zero information leakage: suppress server headers & custom JSON error handlers.
# 2. Strict rate limiting zones with real IP resolution.
# 3. File upload limits (10MB body cap) & execution-blocked internal storage.
# ============================================================================

user nginx;
worker_processes auto;
worker_rlimit_nofile 65535;
pid /var/run/nginx.pid;

events {
    worker_connections 8192;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Suppress server version and identification tokens
    server_tokens off;

    # Maximum Request Body Size (Enforces strict 10MB ceiling for document uploads)
    client_max_body_size 10M;
    client_body_buffer_size 128k;

    # Structured JSON Access Logging for SIEM / Security Monitoring
    log_format json_analytics escape=json '{'
        '"time_local":"$time_local",'
        '"client_ip":"$remote_addr",'
        '"real_client_ip":"$http_cf_connecting_ip",'
        '"request_id":"$request_id",'
        '"request_method":"$request_method",'
        '"request_uri":"$request_uri",'
        '"status":$status,'
        '"body_bytes_sent":$body_bytes_sent,'
        '"request_time":$request_time,'
        '"http_referrer":"$http_referer",'
        '"http_user_agent":"$http_user_agent",'
        '"upstream_response_time":"$upstream_response_time"'
    '}';

    access_log /var/log/nginx/access_json.log json_analytics buffer=32k flush=5s;
    error_log /var/log/nginx/error.log warn;

    # Performance Optimizations
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/xml
        image/svg+xml;

    # Real Client IP Resolution (Cloudflare / Internal Proxy CIDRs)
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header CF-Connecting-IP;
    real_ip_recursive on;

    # Rate Limiting Zones
    limit_req_zone $binary_remote_addr zone=api_general_limit:20m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=auth_strict_limit:10m rate=5r/m;
    limit_req_zone $binary_remote_addr zone=submission_limit:10m rate=10r/m;
    limit_req_zone $binary_remote_addr zone=upload_limit:10m rate=5r/m;
    limit_conn_zone $binary_remote_addr zone=addr_conn_limit:10m;

    limit_req_status 429;
    limit_conn_status 429;

    # Upstream Backend Microservices
    upstream api_backend_cluster {
        server api-service-1:8080 max_fails=3 fail_timeout=10s;
        server api-service-2:8080 max_fails=3 fail_timeout=10s;
        keepalive 64;
    }

    # HTTP to HTTPS Strict Redirect
    server {
        listen 80;
        listen [::]:80;
        server_name foodbridge.org www.foodbridge.org;
        return 301 https://$host$request_uri;
    }

    # Main HTTPS Virtual Host
    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name foodbridge.org www.foodbridge.org;

        # TLS 1.2 and 1.3 Hardened Suite
        ssl_certificate /etc/letsencrypt/live/foodbridge.org/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/foodbridge.org/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:50m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        # Strict Security Headers
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://cdn.tailwindcss.com; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://api.foodbridge.org; frame-ancestors 'none';" always;
        add_header X-Request-ID $request_id always;

        root /usr/share/nginx/html;
        index index.html;

        limit_conn addr_conn_limit 50;

        # ====================================================================
        # Standardized Error Handlers (Zero Information Leakage)
        # Prevents leaking internal database errors, call stacks, paths, or versions
        # ====================================================================
        error_page 400 = @err_400;
        location @err_400 {
            default_type application/json;
            add_header X-Request-ID $request_id always;
            return 400 '{"type":"https://foodbridge.org/errors/bad-request","title":"Bad Request","status":400,"detail":"The request syntax or parameters are invalid.","request_id":"$request_id"}';
        }

        error_page 401 = @err_401;
        location @err_401 {
            default_type application/json;
            add_header X-Request-ID $request_id always;
            return 401 '{"type":"https://foodbridge.org/errors/unauthorized","title":"Unauthorized","status":401,"detail":"Valid authentication credentials are required to access this resource.","request_id":"$request_id"}';
        }

        error_page 403 = @err_403;
        location @err_403 {
            default_type application/json;
            add_header X-Request-ID $request_id always;
            return 403 '{"type":"https://foodbridge.org/errors/forbidden","title":"Forbidden","status":403,"detail":"You do not possess the required permissions to perform this action.","request_id":"$request_id"}';
        }

        error_page 404 = @err_404;
        location @err_404 {
            default_type application/json;
            add_header X-Request-ID $request_id always;
            return 404 '{"type":"https://foodbridge.org/errors/not-found","title":"Resource Not Found","status":404,"detail":"The requested operational resource does not exist.","request_id":"$request_id"}';
        }

        error_page 413 = @err_413;
        location @err_413 {
            default_type application/json;
            add_header X-Request-ID $request_id always;
            return 413 '{"type":"https://foodbridge.org/errors/payload-too-large","title":"Payload Too Large","status":413,"detail":"Uploaded file or manifest payload exceeds the maximum permissible limit of 10 MB.","request_id":"$request_id"}';
        }

        error_page 415 = @err_415;
        location @err_415 {
            default_type application/json;
            add_header X-Request-ID $request_id always;
            return 415 '{"type":"https://foodbridge.org/errors/unsupported-media-type","title":"Unsupported Media Type","status":415,"detail":"Submitted format is not supported. Only verified PDF, JPEG, and PNG formats are accepted.","request_id":"$request_id"}';
        }

        error_page 429 = @err_429;
        location @err_429 {
            default_type application/json;
            add_header Retry-After 30 always;
            add_header X-Request-ID $request_id always;
            return 429 '{"type":"https://foodbridge.org/errors/rate-limit-exceeded","title":"Too Many Requests","status":429,"detail":"Rate limit threshold exceeded. Please retry after delay.","retry_after_seconds":30,"request_id":"$request_id"}';
        }

        error_page 500 502 503 504 = @err_5xx;
        location @err_5xx {
            default_type application/json;
            add_header X-Request-ID $request_id always;
            return 500 '{"type":"https://foodbridge.org/errors/internal-server-error","title":"Internal Server Error","status":500,"detail":"An internal error occurred. Operational diagnostic logs have been recorded.","request_id":"$request_id"}';
        }

        # Static Portal Files
        location / {
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-cache, must-revalidate";
        }

        # Immutable Static Assets Caching
        location ~* \.(?:css|js|svg|woff2?|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, max-age=31536000, immutable";
            access_log off;
        }

        # Isolated Storage for Uploaded Inspection Media & Documents
        # Placed completely outside web root, internal access only via API authentication
        location /internal-storage/uploads/ {
            internal;
            alias /var/foodbridge/storage/uploads/;
            
            # Disable script execution completely
            types { }
            default_type application/octet-stream;
            
            # Force download disposition to prevent browser script execution
            add_header Content-Disposition "attachment";
            add_header X-Content-Type-Options "nosniff" always;
        }

        # Dedicated Upload Endpoint with Strict Size & Rate Limiting
        location /v1/uploads/ {
            limit_req zone=upload_limit burst=3 nodelay;
            client_max_body_size 10M;

            proxy_pass http://api_backend_cluster;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Request-ID $request_id;
            
            # Fast timeouts for upload streams
            proxy_connect_timeout 5s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
        }

        # General API Gateway Route
        location /v1/ {
            limit_req zone=api_general_limit burst=20 nodelay;

            proxy_pass http://api_backend_cluster;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;

            proxy_connect_timeout 5s;
            proxy_send_timeout 15s;
            proxy_read_timeout 15s;
        }

        # High-Risk Form Submissions Route
        location ~ ^/v1/(donations|agencies/register) {
            limit_req zone=submission_limit burst=5 nodelay;
            proxy_pass http://api_backend_cluster;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Request-ID $request_id;
        }

        # Authentication Endpoints Route
        location /v1/auth/ {
            limit_req zone=auth_strict_limit burst=2 nodelay;
            proxy_pass http://api_backend_cluster;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Request-ID $request_id;
        }

        # Health Probe for Container / Orchestrator
        location /healthz {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }
    }
}
