name: FoodBridge Production CI/CD Pipeline

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-validate:
    name: Linting & Schema Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Validation Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml jsonschema

      - name: Validate OpenAPI 3.1 Specification
        run: |
          python -c "
          import yaml
          with open('api/openapi.yaml', 'r') as f:
              doc = yaml.safe_load(f)
          assert doc['openapi'].startswith('3.1'), 'OpenAPI version mismatch'
          assert '/donations' in doc['paths'], 'Missing /donations route'
          print('OpenAPI specification validated successfully.')
          "

      - name: Validate Static Code Compliance
        run: |
          python tests/test_system.py

  security-audit:
    name: Security & Secret Scanning
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run FoodBridge Security Scanner
        run: |
          python scripts/audit_security.py

      - name: Run TruffleHog Secret Scanner
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
        continue-on-error: true

  test-suite:
    name: Integration & Platform Tests
    runs-on: ubuntu-latest
    needs: [lint-and-validate]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Platform Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install PyJWT cryptography

      - name: Run Master Platform & Architecture Tests
        run: |
          python tests/test_system.py

      - name: Run API Contract & Authentication Tests
        run: |
          python tests/test_api_endpoints.py

      - name: Run Binary File Upload & Error Defense Tests
        run: |
          python tests/test_file_upload_and_errors.py

      - name: Validate Database Schema Migrations
        run: |
          python scripts/run_migrations.py

  build-container:
    name: Container Build & Push
    runs-on: ubuntu-latest
    needs: [test-suite]
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Web & Proxy Container
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: foodbridge/gateway:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [build-container]
    if: startsWith(github.ref, 'refs/tags/v')
    environment:
      name: production
      url: https://foodbridge.org
    steps:
      - name: Deploy to Cloud Cluster
        run: |
          echo "Deploying release ${{ github.ref_name }} to production cluster..."
          # Integrates with Kubernetes kubectl rollout / Terraform / AWS ECS
